name: AGP

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Verbose output'
        required: false
        default: 'false'

jobs:
  agp:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: sonatype/agp-action@v1
        with:
          docker-image: ${{ vars.AGP_DOCKER_IMAGE }}
          skip-docker-pull: 'true'
          create-pr: 'true'
          verbose: ${{ inputs.verbose }}
        env:
          AGP_API_URL: https://api.guide-dev.sonatype.dev
          AGP_API_TOKEN: ${{ secrets.AGP_API_TOKEN }}
